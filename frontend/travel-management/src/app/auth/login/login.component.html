<section class="auth-page">
  <div class="auth-glow auth-glow-left"></div>
  <div class="auth-glow auth-glow-right"></div>

  <div class="auth-container">
    <article class="auth-card">
      <header class="auth-header">
        <span class="auth-badge">Travel Desk</span>
        <h1>Login</h1>
        <p>Enter the details below to continue.</p>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="field-group">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            formControlName="email"
            placeholder="name@company.com"
            (input)="authErrorMessage = ''"
          />
          <small
            class="field-error"
            *ngIf="
              (loginForm.get('email')?.touched || submitted) &&
              loginForm.get('email')?.errors?.['required']
            "
          >
            Email is required
          </small>
          <small
            class="field-error"
            *ngIf="
              (loginForm.get('email')?.touched || submitted) &&
              loginForm.get('email')?.errors?.['email']
            "
          >
            Please enter a valid email address
          </small>
        </div>

        <div class="field-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            formControlName="password"
            placeholder="Enter your password"
            (input)="authErrorMessage = ''"
          />
          <small
            class="field-error"
            *ngIf="
              (loginForm.get('password')?.touched || submitted) &&
              loginForm.get('password')?.errors?.['required']
            "
          >
            Password is required
          </small>
        </div>

        <button
          class="auth-submit"
          type="submit"
          [disabled]="loginForm.invalid"
        >
          Login
        </button>

        <small class="auth-alert" *ngIf="authErrorMessage">{{
          authErrorMessage
        }}</small>

        <p class="auth-footer-text">
          Don't have an account?
          <a routerLink="/register">Create one</a>
        </p>
      </form>
    </article>
  </div>
</section>
