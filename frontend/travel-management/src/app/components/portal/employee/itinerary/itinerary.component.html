<app-navbar></app-navbar>

<div class="itinerary-page" *ngIf="request; else notFound">
  <!-- ── BACK LINK ── -->
  <div class="back-link" (click)="goBack()">
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <polyline points="15 18 9 12 15 6" />
    </svg>
    Back to Request Details
  </div>

  <!-- ── PAGE TITLE ── -->
  <div class="page-header">
    <h1 class="page-title">Create Itinerary: {{ request.destination }}</h1>
    <p class="trip-dates">
      Trip Dates: {{ request.fromDate | date: "MMM dd" }} –
      {{ request.toDate | date: "MMM dd, yyyy" }}
    </p>
  </div>

  <!-- ── DAY CARDS ── -->
  <div class="days-list">
    <div class="day-card" *ngFor="let day of days; let di = index">
      <!-- DAY HEADER -->
      <div class="day-header">
        <div class="day-icon">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#2563eb"
            stroke-width="2"
          >
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
        </div>
        <div class="day-title-wrap">
          <div class="day-title">
            Day {{ day.dayNumber }}: {{ day.date | date: "MMM dd" }}
          </div>
          <!-- Editable day subtitle/label -->
          <input
            class="day-subtitle-input"
            type="text"
            [(ngModel)]="day.label"
            placeholder="e.g. Arrival & Initial Meetings"
          />
        </div>
      </div>

      <!-- ACTIVITIES -->
      <div class="activities-list">
        <div
          class="activity-block"
          *ngFor="let activity of day.activities; let ai = index"
        >
          <!-- Activity Title + Time row -->
          <div class="activity-row">
            <div class="field-group flex-2">
              <label class="field-label">Activity Title</label>
              <input
                class="field-input"
                type="text"
                [(ngModel)]="activity.title"
                placeholder="e.g. Flight Arrival"
              />
            </div>
            <div class="field-group flex-1">
              <label class="field-label">Time</label>
              <div class="time-input-wrap">
                <input
                  class="field-input"
                  type="time"
                  [(ngModel)]="activity.time"
                />
              </div>
            </div>
          </div>

          <!-- Location -->
          <div class="field-group">
            <label class="field-label">Location</label>
            <div class="location-input-wrap">
              <svg
                class="location-icon"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#94a3b8"
                stroke-width="2"
              >
                <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z" />
                <circle cx="12" cy="10" r="3" />
              </svg>
              <input
                class="field-input location-input"
                type="text"
                [(ngModel)]="activity.location"
                placeholder="Hotel or Office Address"
              />
            </div>
          </div>

          <!-- Description -->
          <div class="field-group">
            <label class="field-label">Description</label>
            <textarea
              class="field-textarea"
              [(ngModel)]="activity.description"
              placeholder="Brief notes about the activity..."
              rows="3"
            ></textarea>
          </div>

          <!-- Remove activity button (only if more than 1) -->
          <button
            class="remove-activity-btn"
            *ngIf="day.activities.length > 1"
            (click)="removeActivity(di, ai)"
          >
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
            Remove
          </button>

          <!-- Divider between activities -->
          <div
            class="activity-divider"
            *ngIf="ai < day.activities.length - 1"
          ></div>
        </div>
      </div>

      <!-- ADD ACTIVITY BUTTON -->
      <button class="add-activity-btn" (click)="addActivity(di)">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#2563eb"
          stroke-width="2.5"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="16" />
          <line x1="8" y1="12" x2="16" y2="12" />
        </svg>
        Add Activity
      </button>
    </div>
  </div>

  <!-- ── BOTTOM ACTION BAR ── -->
  <div class="bottom-bar">
    <button class="cancel-btn" (click)="goBack()">Cancel</button>
    <button class="save-btn" (click)="saveItinerary()" [disabled]="saving">
      {{ saving ? "Saving..." : "Save Itinerary" }}
    </button>
  </div>
</div>

<!-- ── NOT FOUND ── -->
<ng-template #notFound>
  <div class="not-found">
    <h2>Request not found</h2>
    <p>Could not load itinerary for this request.</p>
    <button class="save-btn" (click)="goBack()">← Go Back</button>
  </div>
</ng-template>
