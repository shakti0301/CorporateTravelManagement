<div class="cp-overlay" (click)="onOverlayClick($event)">
  <div class="cp-modal" role="dialog" aria-labelledby="cp-title">
    <!-- Close Button -->
    <button
      class="cp-close-btn"
      (click)="closeModal()"
      aria-label="Close"
      type="button"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>

    <!-- Header -->
    <div class="cp-header">
      <div class="cp-icon-wrap">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>
      <h2 id="cp-title">Change Password</h2>
      <p class="cp-subtitle">
        Enter your current password and choose a new one
      </p>
    </div>

    <!-- Form -->
    <form
      [formGroup]="changePasswordForm"
      (ngSubmit)="onSubmit()"
      novalidate
      class="cp-form"
    >
      <!-- Current Password -->
      <div class="cp-field-group">
        <label for="currentPassword" class="cp-label">Current Password</label>
        <div class="cp-password-field">
          <input
            [type]="showCurrentPassword ? 'text' : 'password'"
            id="currentPassword"
            class="cp-input"
            formControlName="currentPassword"
            placeholder="Enter current password"
            (input)="errorMessage = ''"
          />
          <button
            type="button"
            class="cp-toggle-btn"
            (click)="toggleCurrentPasswordVisibility()"
            [attr.aria-label]="
              showCurrentPassword ? 'Hide password' : 'Show password'
            "
          >
            <span class="cp-toggle-text">{{
              showCurrentPassword ? "Hide" : "Show"
            }}</span>
          </button>
        </div>
        <small
          class="cp-error"
          *ngIf="
            (changePasswordForm.get('currentPassword')?.touched || submitted) &&
            changePasswordForm.get('currentPassword')?.errors?.['required']
          "
        >
          Current password is required
        </small>
      </div>

      <!-- New Password -->
      <div class="cp-field-group">
        <label for="newPassword" class="cp-label">New Password</label>
        <div class="cp-password-field">
          <input
            [type]="showNewPassword ? 'text' : 'password'"
            id="newPassword"
            class="cp-input"
            formControlName="newPassword"
            placeholder="Enter new password"
            (input)="errorMessage = ''"
          />
          <button
            type="button"
            class="cp-toggle-btn"
            (click)="toggleNewPasswordVisibility()"
            [attr.aria-label]="
              showNewPassword ? 'Hide password' : 'Show password'
            "
          >
            <span class="cp-toggle-text">{{
              showNewPassword ? "Hide" : "Show"
            }}</span>
          </button>
        </div>
        <small
          class="cp-error"
          *ngIf="
            (changePasswordForm.get('newPassword')?.touched || submitted) &&
            changePasswordForm.get('newPassword')?.errors?.['required']
          "
        >
          New password is required
        </small>
        <small
          class="cp-error"
          *ngIf="
            (changePasswordForm.get('newPassword')?.touched || submitted) &&
            changePasswordForm.get('newPassword')?.errors?.['minlength']
          "
        >
          Password must be at least 6 characters
        </small>
      </div>

      <!-- Confirm Password -->
      <div class="cp-field-group">
        <label for="confirmPassword" class="cp-label"
          >Confirm New Password</label
        >
        <div class="cp-password-field">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            class="cp-input"
            formControlName="confirmPassword"
            placeholder="Re-enter new password"
            (input)="errorMessage = ''"
          />
          <button
            type="button"
            class="cp-toggle-btn"
            (click)="toggleConfirmPasswordVisibility()"
            [attr.aria-label]="
              showConfirmPassword ? 'Hide password' : 'Show password'
            "
          >
            <span class="cp-toggle-text">{{
              showConfirmPassword ? "Hide" : "Show"
            }}</span>
          </button>
        </div>
        <small
          class="cp-error"
          *ngIf="
            (changePasswordForm.get('confirmPassword')?.touched || submitted) &&
            changePasswordForm.get('confirmPassword')?.errors?.['required']
          "
        >
          Please confirm your new password
        </small>
        <small
          class="cp-error"
          *ngIf="
            (changePasswordForm.get('confirmPassword')?.touched || submitted) &&
            changePasswordForm.errors?.['passwordMismatch'] &&
            !changePasswordForm.get('confirmPassword')?.errors?.['required']
          "
        >
          Passwords do not match
        </small>
      </div>

      <!-- Submit Button -->
      <button
        class="cp-submit-btn"
        type="submit"
        [disabled]="loading"
        [class.cp-loading]="loading"
      >
        <span *ngIf="!loading">Update Password</span>
        <span *ngIf="loading" class="cp-spinner-wrap">
          <span class="cp-spinner"></span>
          Updating...
        </span>
      </button>

      <!-- Success Message -->
      <div class="cp-alert cp-alert--success" *ngIf="successMessage">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
          <polyline points="22 4 12 14.01 9 11.01" />
        </svg>
        {{ successMessage }}
      </div>

      <!-- Error Message -->
      <div class="cp-alert cp-alert--error" *ngIf="errorMessage">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </svg>
        {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
