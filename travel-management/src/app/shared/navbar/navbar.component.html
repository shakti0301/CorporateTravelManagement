<nav class="nx-navbar">
  <div class="nx-navbar__inner">
    <!-- Mobile Menu Button -->
    <button
      class="nx-mobile-menu-btn"
      (click)="toggleMobileMenu()"
      [class.active]="mobileMenuOpen"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>

    <!-- Brand -->
    <a class="nx-navbar__brand" [routerLink]="dashboardRoute">
      NexTravel Enterprise
    </a>

    <!-- Search -->
    <div class="nx-navbar__search">
      <svg class="nx-search-icon" viewBox="0 0 20 20" fill="none">
        <circle cx="8.5" cy="8.5" r="5.5" stroke="#9CA3AF" stroke-width="1.5" />
        <path
          d="M13 13l3.5 3.5"
          stroke="#9CA3AF"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      <input type="text" placeholder="Search..." class="nx-search-input" />
    </div>

    <!-- Nav Links -->
    <ul class="nx-navbar__links" [class.mobile-open]="mobileMenuOpen">
      <!-- EMPLOYEE LINKS -->
      <li *ngIf="user?.role === 'employee'" (click)="closeMobileMenu()">
        <a
          routerLink="/employee"
          routerLinkActive="nx-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nx-link"
        >
          Dashboard
        </a>
      </li>
      <li *ngIf="user?.role === 'employee'" (click)="closeMobileMenu()">
        <a
          routerLink="/employee/myrequests"
          routerLinkActive="nx-link--active"
          class="nx-link"
        >
          My Requests
        </a>
      </li>
      <li *ngIf="user?.role === 'employee'" (click)="closeMobileMenu()">
        <a
          routerLink="/employee/request"
          routerLinkActive="nx-link--active"
          class="nx-link"
        >
          Create Request
        </a>
      </li>
      <li *ngIf="user?.role === 'employee'" (click)="closeMobileMenu()">
        <a
          routerLink="/employee/approvals"
          routerLinkActive="nx-link--active"
          class="nx-link"
        >
          Approvals
        </a>
      </li>
      <li *ngIf="user?.role === 'employee'" (click)="closeMobileMenu()">
        <a
          routerLink="/employee/reports"
          routerLinkActive="nx-link--active"
          class="nx-link"
        >
          Reports
        </a>
      </li>

      <!-- MANAGER LINKS -->
      <li *ngIf="user?.role === 'manager'" (click)="closeMobileMenu()">
        <a
          routerLink="/manager"
          routerLinkActive="nx-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nx-link"
        >
          Dashboard
        </a>
      </li>
      <li *ngIf="user?.role === 'manager'" (click)="closeMobileMenu()">
        <a
          routerLink="/manager/approval"
          routerLinkActive="nx-link--active"
          class="nx-link"
        >
          Approvals
        </a>
      </li>
      <li *ngIf="user?.role === 'manager'" (click)="closeMobileMenu()">
        <a
          routerLink="/manager/reports"
          routerLinkActive="nx-link--active"
          class="nx-link"
        >
          Reports
        </a>
      </li>

      <!-- FINANCE LINKS -->
      <li *ngIf="user?.role === 'finance'" (click)="closeMobileMenu()">
        <a
          routerLink="/finance"
          routerLinkActive="nx-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nx-link"
        >
          Dashboard
        </a>
      </li>
      <li *ngIf="user?.role === 'finance'" (click)="closeMobileMenu()">
        <a
          routerLink="/finance/approval"
          routerLinkActive="nx-link--active"
          class="nx-link"
        >
          Approvals
        </a>
      </li>
      <li *ngIf="user?.role === 'finance'" (click)="closeMobileMenu()">
        <a
          routerLink="/finance/reimbursement"
          routerLinkActive="nx-link--active"
          class="nx-link"
        >
          Expenses
        </a>
      </li>
      <li *ngIf="user?.role === 'finance'" (click)="closeMobileMenu()">
        <a
          routerLink="/finance/reports"
          routerLinkActive="nx-link--active"
          class="nx-link"
        >
          Reports
        </a>
      </li>
    </ul>

    <!-- Right Icons -->
    <div class="nx-navbar__actions">
      <!-- Notification Bell -->
      <button class="nx-icon-btn" title="Notifications">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
      </button>

      <!-- Help -->
      <button class="nx-icon-btn" title="Help">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
          <line x1="12" y1="17" x2="12.01" y2="17" stroke-width="2.5" />
        </svg>
      </button>

      <!-- Settings -->
      <button class="nx-icon-btn" title="Settings">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          />
        </svg>
      </button>

      <!-- Avatar with dropdown -->
      <div
        class="nx-avatar-wrap"
        (click)="toggleMenu()"
        title="{{ user?.name }}"
      >
        <div class="nx-avatar">
          {{ getInitials() }}
        </div>
        <div class="nx-dropdown" *ngIf="menuOpen">
          <div class="nx-dropdown__header">
            <span class="nx-dropdown__name">{{ user?.name }}</span>
            <span
              class="nx-dropdown__role nx-role-badge nx-role-badge--{{
                user?.role
              }}"
              >{{ user?.role | titlecase }}</span
            >
          </div>
          <hr class="nx-dropdown__divider" />
          <button
            class="nx-dropdown__item nx-dropdown__item--danger"
            (click)="logout()"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
