<section
  class="container-fluid min-vh-100 d-flex align-items-center py-5"
  style="
    background: linear-gradient(135deg, #f8fbff 0%, #eaf6ef 45%, #f4f1ff 100%);
  "
>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4">
          <div class="card-body p-4 p-md-5">
            <span class="badge rounded-pill text-bg-success mb-3"
              >Travel Desk</span
            >
            <h2 class="h3 fw-bold mb-1">Login</h2>
            <p class="text-secondary mb-4">Access your account</p>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input
                  type="email"
                  id="email"
                  class="form-control form-control-lg"
                  formControlName="email"
                  placeholder="name@company.com"
                />
                <small
                  class="text-danger d-block mt-1"
                  *ngIf="
                    (loginForm.get('email')?.touched || submitted) &&
                    loginForm.get('email')?.errors?.['required']
                  "
                >
                  Email is required
                </small>
                <small
                  class="text-danger d-block mt-1"
                  *ngIf="
                    (loginForm.get('email')?.touched || submitted) &&
                    loginForm.get('email')?.errors?.['email']
                  "
                >
                  Please enter a valid email address
                </small>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label fw-semibold"
                  >Password</label
                >
                <input
                  type="password"
                  id="password"
                  class="form-control form-control-lg"
                  formControlName="password"
                  placeholder="Enter your password"
                />
                <small
                  class="text-danger d-block mt-1"
                  *ngIf="
                    (loginForm.get('password')?.touched || submitted) &&
                    loginForm.get('password')?.errors?.['required']
                  "
                >
                  Password is required
                </small>
                <small
                  class="text-danger d-block mt-1"
                  *ngIf="
                    (loginForm.get('password')?.touched || submitted) &&
                    loginForm.get('password')?.errors?.['minlength']
                  "
                >
                  Password must be at least 8 characters
                </small>
                <small
                  class="text-danger d-block mt-1"
                  *ngIf="
                    (loginForm.get('password')?.touched || submitted) &&
                    loginForm.get('password')?.errors?.['maxlength']
                  "
                >
                  Password cannot exceed 64 characters
                </small>
              </div>

              <button
                class="btn btn-primary btn-lg w-100 mt-2"
                type="submit"
                [disabled]="loginForm.invalid"
              >
                Login
              </button>

              <p class="text-center text-secondary mt-4 mb-0">
                Don't have an account?
                <a
                  class="fw-semibold text-decoration-none"
                  routerLink="/register"
                  >Register here</a
                >
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
