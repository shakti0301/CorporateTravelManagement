<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right text-primary me-2"></i>Login</h3>
        
        <div *ngIf="errorMessage" class="alert alert-danger py-2">{{ errorMessage }}</div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label text-muted fw-semibold">Email address</label>
            <input type="email" class="form-control" formControlName="email" placeholder="name@example.com">
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger small mt-1">
              <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</span>
              <span *ngIf="loginForm.get('email')?.errors?.['email']">Must be a valid email.</span>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted fw-semibold">Password</label>
            <input type="password" class="form-control" formControlName="password" placeholder="Enter password">
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger small mt-1">
              <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3 py-2 fw-semibold" [disabled]="loginForm.invalid">
            Login
          </button>
        </form>
        
        <div class="text-center mt-3">
          <span class="text-muted">Don't have an account? </span>
          <a routerLink="/auth/register" class="text-decoration-none fw-semibold">Register here</a>
        </div>
      </div>
    </div>
  </div>
</div>
