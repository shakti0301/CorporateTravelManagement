<div class="container mt-4">
  <div class="row mb-3">
    <div class="col">
      <h2 class="fw-bold">Welcome, {{ authService.getCurrentUser()?.email }}!</h2>
      <p class="text-muted">You are logged in as a <span class="badge bg-secondary">{{ role }}</span>.</p>
    </div>
  </div>

  <!-- Conditional UI routing based on role mapping -->
  <ng-container *ngIf="role === 'Employee'">
    <app-employee></app-employee>
  </ng-container>

  <ng-container *ngIf="role === 'Manager'">
    <app-manager></app-manager>
  </ng-container>

  <ng-container *ngIf="role === 'Finance'">
    <app-finance></app-finance>
  </ng-container>

  <!-- Fallback empty state if invalid role -->
  <ng-container *ngIf="!role || (role !== 'Employee' && role !== 'Manager' && role !== 'Finance')">
    <div class="alert alert-warning">
      Unrecognized role configuration. Contact support.
    </div>
  </ng-container>
</div>
